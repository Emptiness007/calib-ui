<section class="d-flex flex-column m-1 my-3 p-1 h-100 overflow-auto">
  <div class="d-flex justify-content-center gap-2 mb-3">
    @for(t of izdelieTypes; track t){
      <button
        type="button"
        class="btn nav-link"
        [class.active]="activeTab() === t"
        (click)="onChangeTab(t)" >
        {{ ('CALCULATION-TYPE.' + t) | translate }}
      </button>
    }
  </div>
  <div class="d-flex flex-column overflow-auto h-100 align-items-center">
    <app-calculation-page class="d-flex flex-column gap-3"
    [izdelieType]="activeTab()">
    </app-calculation-page>
  </div>
</section>
